version: 2

# There is no uv entry. PR #168 removed the Python distribution and its
# pyproject.toml, so the repository has no Python dependencies to update.
updates:
  - package-ecosystem: npm
    directory: /typescript
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: build(deps)
      prefix-development: build(deps-dev)
    groups:
      npm:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: build(deps)
    groups:
      actions:
        patterns:
          - "*"

  # The entry above scans .github/workflows only, so composite actions need
  # their own entry. Do not merge the two.
  - package-ecosystem: github-actions
    directories:
      - /.github/actions/*
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: build(deps)
    groups:
      composite-actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directories:
      - /
      - /.devcontainer
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: build(deps)
    groups:
      images:
        patterns:
          - "*"
