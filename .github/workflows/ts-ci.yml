name: TypeScript CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # nightly at 02:30 UTC — runs the performance suite
    - cron: "30 2 * * *"

jobs:
  ts-check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/ts-checks

      - run: npm run test:coverage

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v5
        with:
          flags: unit
          fail_ci_if_error: false

      - run: npm run test:integration

      - name: Assert no golden fixture drift
        # Pathspec is relative to the job's working-directory (typescript/).
        run: |
          npm run generate:golden
          git diff --exit-code -- __tests__/golden/fixtures/

  ts-docker-build:
    name: Docker smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build TypeScript runtime image
        run: docker build --progress=plain -f Dockerfile --target runtime -t openroad-mcp-ts:ci .

      - name: Smoke-run entrypoint from built image
        run: docker run --rm openroad-mcp-ts:ci --help

  ts-docker-test:
    name: Docker test stage (real OpenROAD)
    uses: ./.github/workflows/docker-test.yml

  ts-perf:
    name: Performance benchmarks (nightly)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: typescript/package-lock.json

      - run: npm ci

      - run: npm run test:performance
