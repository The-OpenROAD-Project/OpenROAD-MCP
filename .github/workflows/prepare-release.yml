name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare-release:
    name: Prepare ${{ inputs.bump_type }} release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          token: ${{ github.token }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: typescript/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: typescript

      - name: Run checks
        working-directory: typescript
        run: |
          npm run typecheck
          npm run lint
          npm run test

      - name: Compute new version
        id: version
        run: |
          CURRENT=$(jq -r '.version' typescript/package.json)
          IFS='.' read -r MAJ MIN PAT <<< "$CURRENT"
          case "${{ inputs.bump_type }}" in
            major) MAJ=$((MAJ+1)); MIN=0; PAT=0 ;;
            minor) MIN=$((MIN+1)); PAT=0 ;;
            patch) PAT=$((PAT+1)) ;;
          esac
          NEW="${MAJ}.${MIN}.${PAT}"
          echo "current=${CURRENT}" >> "$GITHUB_OUTPUT"
          echo "new=${NEW}" >> "$GITHUB_OUTPUT"
          echo "tag=v${NEW}" >> "$GITHUB_OUTPUT"
          echo "branch=release/v${NEW}" >> "$GITHUB_OUTPUT"
          echo "Bumping ${CURRENT} → ${NEW} (${{ inputs.bump_type }})"

      - name: Generate changelog entries
        run: python3 .github/scripts/generate_changelog_section.py

      - name: Update typescript/package.json
        working-directory: typescript
        run: |
          npm version --no-git-tag-version --allow-same-version \
            "${{ steps.version.outputs.new }}"

      - name: Update server.json
        run: |
          if [ -f server.json ]; then
            OLD="${{ steps.version.outputs.current }}"
            NEW="${{ steps.version.outputs.new }}"
            sed -i "s/\"version\": \"${OLD}\"/\"version\": \"${NEW}\"/g" server.json
            sed -i "s|ghcr.io/[Tt]he-[Oo]pen[Rr][Oo][Aa][Dd]-[Pp]roject/openroad-mcp:${OLD}|ghcr.io/the-openroad-project/openroad-mcp:${NEW}|g" server.json
          fi

      - name: Update CHANGELOG.md
        run: |
          python3 .github/scripts/update_changelog.py \
            "${{ steps.version.outputs.new }}" \
            "${{ steps.version.outputs.tag }}"

      - name: Verify no stale version references
        run: |
          NEW="${{ steps.version.outputs.new }}"
          FAIL=0

          check() {
            if [ "$2" != "$3" ]; then
              echo "ERROR: $1 is '$2', expected '$3'"
              FAIL=1
            fi
          }

          check "typescript/package.json version" \
            "$(jq -r '.version' typescript/package.json)" "$NEW"

          check "typescript/package-lock.json .version" \
            "$(jq -r '.version' typescript/package-lock.json)" "$NEW"

          check "typescript/package-lock.json .packages[\"\"].version" \
            "$(jq -r '.packages[""].version' typescript/package-lock.json)" "$NEW"

          if [ -f server.json ]; then
            check "server.json .version" "$(jq -r '.version' server.json)" "$NEW"
            check "server.json npm package version" \
              "$(jq -r '.packages[] | select(.registryType=="npm") | .version' server.json)" "$NEW"
            check "server.json OCI identifier" \
              "$(jq -r '.packages[] | select(.registryType=="oci") | .identifier' server.json)" \
              "ghcr.io/the-openroad-project/openroad-mcp:${NEW}"
          fi

          if [ "$FAIL" -ne 0 ]; then
            exit 1
          fi
          echo "Version sources updated cleanly to ${NEW}."

      - name: Create release branch and commit
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          BRANCH="${{ steps.version.outputs.branch }}"

          git config user.name "openroad-ci"
          git config user.email "54529053+openroad-ci@users.noreply.github.com"
          git checkout -b "${BRANCH}"
          git add \
            typescript/package.json \
            typescript/package-lock.json \
            CHANGELOG.md
          if [ -f server.json ]; then git add server.json; fi
          git commit -m "chore: release ${TAG}"
          git push -u origin "${BRANCH}"

      - name: Open release PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          BRANCH="${{ steps.version.outputs.branch }}"
          gh pr create \
            --title "chore: release ${TAG}" \
            --body "$(cat <<EOF
          ## Release ${TAG}

          TypeScript/npm version bump.

          See [CHANGELOG.md](https://github.com/The-OpenROAD-Project/openroad-mcp/blob/${BRANCH}/CHANGELOG.md) for full details.

          /cc @vvbandeira @luarss — please review and merge when ready.
          EOF
          )" \
            --reviewer vvbandeira,luarss \
            --base main \
            --head "${BRANCH}"
