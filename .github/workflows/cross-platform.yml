name: Cross-Platform Node

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CI: "true"
  MCP_SERVER_REQUEST_TIMEOUT: 120

jobs:
  node-matrix:
    name: Node ${{ matrix.node-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, macos-14]
        node-version: ["22"]
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: typescript/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Smoke-test entrypoint
        # Exercises node-pty and sharp native module loading — this is the
        # check that actually matters for cross-platform compatibility.
        run: node dist/main.js --help
